---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "hello-kubernetes-ingress"
  namespace: {{ .Values.namespace | quote }}
spec:
  ingressClassName: "nginx"
  rules:
  - host: {{ .Values.ingress.host | quote }}
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: hello-kubernetes-svc
            port:
              number: 80
